[project]
name = "citywide-volunteer-hub"
version = "0.0.0"
description = "Scrapers and shared event format for a city's volunteer calendar."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# Runtime dependencies for pvscrapers are added by pv-scrapers.
dependencies = []

# Test and lint tools (pv-testing). All MIT licensed.
[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "pytest>=8.3",
    "referencing>=0.35",
    "ruff>=0.7",
]

[tool.uv]
# Not installed as a package yet. pv-scrapers switches this on when
# pvscrapers/ gains code.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["site/node_modules", "site/dist"]

[tool.ruff.lint.isort]
known-first-party = ["guards", "pvscrapers"]
