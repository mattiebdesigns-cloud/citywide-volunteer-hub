[project]
name = "citywide-volunteer-hub"
version = "0.1.0"
description = "Scrapers and shared event format for a city's volunteer calendar."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# pvscrapers uses only the Python standard library (pv-scrapers).
dependencies = []

# Test and lint tools (pv-testing). All MIT licensed.
[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "pytest>=8.3",
    "referencing>=0.35",
    "ruff>=0.7",
]

[build-system]
# uv's own build backend (MIT OR Apache-2.0). Used only to install the package.
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "pvscrapers"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["site/node_modules", "site/dist"]

[tool.ruff.lint.isort]
known-first-party = ["guards", "pvscrapers"]
